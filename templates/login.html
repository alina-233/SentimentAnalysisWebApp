<!DOCTYPE html>
<html>
<head>
<title>Auth</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.form-box{display:none;}
.active{display:block;}
</style>

</head>
<body>

<div class="container">

<h2 id="title">Login</h2>

<!-- LOGIN FORM -->
<form action="/login" method="post" id="loginForm" class="form-box active">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
<p>Don't have an account? <a href="#" onclick="showSignup()">Signup</a></p>
</form>

<!-- SIGNUP FORM -->
<form action="/signup" method="post" id="signupForm" class="form-box">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Signup</button>
<p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
</form>

</div>

<script>
function showSignup(){
    document.getElementById("loginForm").classList.remove("active");
    document.getElementById("signupForm").classList.add("active");
    document.getElementById("title").innerText = "Signup";
}

function showLogin(){
    document.getElementById("signupForm").classList.remove("active");
    document.getElementById("loginForm").classList.add("active");
    document.getElementById("title").innerText = "Login";
}
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
