<!DOCTYPE html>
<html>
<head>
<title>History</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid #f0e0d6;
  }

  .topbar-title {
    font-size: .7rem;
    font-weight: 600;
    color: #a47551;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .back-link {
    font-size: .75rem;
    font-weight: 500;
    color: #8d6e63;
    text-decoration: none;
    padding: 5px 12px;
    border: 1px solid #e5d6c8;
    border-radius: 20px;
    transition: all .2s;
  }

  .back-link:hover {
    background: #fdf5ef;
    border-color: #bc8f6f;
    color: #6d4c41;
  }

  .body {
    padding: 24px;
  }

  .section-label {
    font-size: .7rem;
    font-weight: 600;
    color: #a47551;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #c9b0a0;
    font-size: .85rem;
  }
</style>
</head>
<body>
<div class="container-wide" style="padding:0; overflow:hidden;">

  <div class="topbar">
    <span class="topbar-title">Analysis History</span>
    <a class="back-link" href="/dashboard">← Back</a>
  </div>

  <div class="body">
    <p class="section-label">Your past analyses</p>

    <div class="table-container">
      <table>
        <tr>
          <th>Transcription</th>
          <th>Sentiment</th>
        </tr>

        {% if data %}
          {% for item in data %}
          <tr>
            <td>{{ item.text }}</td>
            <td>
              <span class="sentiment {% if item.sentiment == 'POSITIVE' %}positive{% else %}negative{% endif %}">
                {{ item.sentiment }}
              </span>
            </td>
          </tr>
          {% endfor %}
        {% else %}
          <tr>
            <td colspan="2" class="empty">No analyses yet. Go record or upload some audio!</td>
          </tr>
        {% endif %}

      </table>
    </div>
  </div>

</div>

</body>
</html>
